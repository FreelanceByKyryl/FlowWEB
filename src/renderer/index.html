<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Showcase Studio</title>
    <link rel="icon" href="brand.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script defer src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script defer src="studios.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div id="app" class="shell">
      <aside id="sidebar" class="sidebar" aria-label="Application sidebar">
        <div class="brand">
          <img class="brand-icon" src="brand.svg" alt="" width="36" height="36">
          <div class="brand-copy">
            <span class="brand-name">Showcase</span>
            <span class="brand-type">Studio</span>
          </div>
        </div>
        <nav class="sidebar-nav" aria-label="Main navigation">
          <div class="nav-group">
            <span class="nav-label">Workspace</span>
            <button class="nav-item active" type="button" data-view="dashboard" title="Dashboard" aria-current="page"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></button>
            <button class="nav-item" type="button" data-view="projects" title="Projects"><i data-lucide="folder-kanban"></i><span>Projects</span></button>
          </div>
          <div class="nav-group">
            <span class="nav-label">Create</span>
            <button class="nav-item" type="button" data-view="screenshots" title="Screenshot Studio"><i data-lucide="camera"></i><span>Screenshot Studio</span></button>
            <button class="nav-item" type="button" data-view="mockups" title="Mockup Studio"><i data-lucide="layers"></i><span>Mockup Studio</span></button>
            <button class="nav-item" type="button" data-view="videos" title="Video Studio"><i data-lucide="video"></i><span>Video Studio</span></button>
          </div>
          <div class="nav-group">
            <span class="nav-label">Export</span>
            <button class="nav-item" type="button" data-view="batch" title="Batch Export"><i data-lucide="package-open"></i><span>Batch Export</span></button>
            <button class="nav-item" type="button" data-view="history" title="Export History"><i data-lucide="history"></i><span>Export History</span></button>
          </div>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" type="button" data-view="settings" title="Settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
        </div>
      </aside>
      <main id="main" class="workspace">
        <header class="topbar">
          <div class="breadcrumb" aria-label="Current workspace">
            <span>Workspace</span>
            <i data-lucide="chevron-right" aria-hidden="true"></i>
            <span id="page-label">Dashboard</span>
          </div>
          <button class="theme-toggle icon-button" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"><i data-lucide="sun" aria-hidden="true"></i></button>
        </header>
        <div id="view" class="view" tabindex="-1" aria-busy="true">
          <div class="initial-loading" role="status"><span class="spinner" aria-hidden="true"></span>Opening your workspace…</div>
        </div>
      </main>
    </div>
    <dialog id="dialog" class="dialog"></dialog>
    <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  </body>
</html>
